<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102D2A"><title>Breath Loop — Interactive Specimen 74</title><style>
/* Design reminder: Use the background as a dark chromatic stage; controls should remain obvious and reachable while the animation carries the delight. */
:root{--bg:#102D2A;--a:#7BE7D1;--b:#FFF2A6;--ink:#F7F7FF;--line:rgba(255,255,255,.2)}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(circle at 76% 12%,color-mix(in srgb,var(--a),transparent 85%),transparent 28%),var(--bg);color:var(--ink);font-family:Arial,sans-serif;overflow-x:hidden}.mono{font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}.shell{min-height:100%;padding:20px;display:flex;flex-direction:column;gap:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:18px;letter-spacing:-.07em}.top a,.chip,button{border:1px solid var(--line);background:rgba(0,0,0,.12);color:var(--ink);padding:9px 12px;text-decoration:none;cursor:pointer;transition:.2s ease}.top a:hover,.chip:hover,button:hover{border-color:var(--b);background:var(--b);color:var(--bg)}.stage{position:relative;flex:1;min-height:540px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--bg),black 16%),var(--bg));box-shadow:0 30px 80px rgba(0,0,0,.25)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.caption{position:absolute;left:clamp(22px,5vw,70px);top:clamp(30px,7vw,92px);z-index:2;max-width:min(580px,78vw);pointer-events:none}.caption .eyebrow{color:var(--b);margin-bottom:17px}.caption h1{font-size:clamp(42px,7vw,98px);line-height:.78;letter-spacing:-.09em;margin:0}.caption p{max-width:400px;line-height:1.5;color:rgba(255,255,255,.68);font-size:16px;margin:24px 0 0}.hud{position:absolute;z-index:2;right:18px;bottom:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.meter{min-width:150px;border:1px solid var(--line);padding:9px 10px;background:rgba(4,4,16,.4);backdrop-filter:blur(8px)}.meter b{display:block;color:var(--b);font-size:16px;margin-top:4px}.utility-stage{display:grid;place-items:center;padding:clamp(20px,5vw,60px)}.panel{width:min(760px,100%);position:relative;z-index:3;border:1px solid var(--line);padding:clamp(22px,4vw,46px);background:rgba(8,8,22,.34);backdrop-filter:blur(18px);box-shadow:14px 14px 0 color-mix(in srgb,var(--a),transparent 78%)}.panel .eyebrow{color:var(--b);margin:0 0 14px}.panel h1{font-size:clamp(36px,6vw,76px);line-height:.85;letter-spacing:-.08em;margin:0}.panel p{color:rgba(255,255,255,.7);line-height:1.5;max-width:500px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:27px}.field{width:100%;margin-top:17px}.field label{display:flex;justify-content:space-between;margin-bottom:8px;color:rgba(255,255,255,.72)}input,select,textarea{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);padding:12px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--b)}input[type=range]{padding:0;accent-color:var(--b)}.result{margin-top:20px;border-top:1px solid var(--line);padding-top:18px;font-size:clamp(22px,4vw,40px);font-weight:800;letter-spacing:-.06em}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.tile{min-height:70px;border:1px solid var(--line);padding:10px;font-size:12px;cursor:pointer}.tile:hover,.tile.active{background:var(--a);color:var(--bg)}.orbit-card{position:absolute;z-index:2;right:18px;top:18px;width:min(300px,39vw);border:1px solid var(--line);padding:14px;background:rgba(5,5,15,.48);backdrop-filter:blur(9px)}.orbit-card h2{margin:5px 0 0;font-size:25px;letter-spacing:-.06em}.orbit-card p{font-size:12px;line-height:1.45;color:rgba(255,255,255,.65)}.ring{width:18px;height:18px;border:3px solid var(--b);border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}@media(max-width:680px){.shell{padding:12px}.stage{min-height:640px}.caption{top:48px}.caption h1{font-size:52px}.orbit-card{top:auto;bottom:18px;right:18px;width:calc(100% - 36px)}.hud{left:18px;right:auto}.tiles{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">Breath Loop</div><span class="mono">CHROMA / 74 of 80</span></div><a class="mono" href="../../../../index.html">THIRTY ARCHIVE ↗</a></header><main class="stage utility-stage"><section class="panel"><p class="mono eyebrow">UTILITY / 74</p><h1>Breath Loop</h1><p>跟随圆形节奏呼吸：吸气四拍，停顿四拍，呼气四拍。</p><div class="result" id="breath">准备</div><div class="controls"><button id="breathStart">开始循环</button><button id="breathStop">暂停</button></div></section></main></div><script>let timer;const o=document.querySelector('#breath');const seq=['吸气','停顿','呼气','停顿'];let i=0;document.querySelector('#breathStart').onclick=()=>{clearInterval(timer);i=0;timer=setInterval(()=>{o.textContent=seq[i%4];document.querySelector('.panel').style.transform='scale('+(seq[i%4]==='吸气'?1.04:.98)+')';i++},4000)};document.querySelector('#breathStop').onclick=()=>clearInterval(timer);</script></body></html>
