:root{--bg:#130038;--a:#7B2CFF;--b:#FFEA70;--ink:#F7F7FF;--line:rgba(255,255,255,.2)}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(circle at 76% 12%,color-mix(in srgb,var(--a),transparent 85%),transparent 28%),var(--bg);color:var(--ink);font-family:Arial,sans-serif;overflow-x:hidden}.mono{font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}.shell{min-height:100%;padding:20px;display:flex;flex-direction:column;gap:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:18px;letter-spacing:-.07em}.top a,.chip,button{border:1px solid var(--line);background:rgba(0,0,0,.12);color:var(--ink);padding:9px 12px;text-decoration:none;cursor:pointer;transition:.2s ease}.top a:hover,.chip:hover,button:hover{border-color:var(--b);background:var(--b);color:var(--bg)}.stage{position:relative;flex:1;min-height:540px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--bg),black 16%),var(--bg));box-shadow:0 30px 80px rgba(0,0,0,.25)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.caption{position:absolute;left:clamp(22px,5vw,70px);top:clamp(30px,7vw,92px);z-index:2;max-width:min(580px,78vw);pointer-events:none}.caption .eyebrow{color:var(--b);margin-bottom:17px}.caption h1{font-size:clamp(42px,7vw,98px);line-height:.78;letter-spacing:-.09em;margin:0}.caption p{max-width:400px;line-height:1.5;color:rgba(255,255,255,.68);font-size:16px;margin:24px 0 0}.hud{position:absolute;z-index:2;right:18px;bottom:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.meter{min-width:150px;border:1px solid var(--line);padding:9px 10px;background:rgba(4,4,16,.4);backdrop-filter:blur(8px)}.meter b{display:block;color:var(--b);font-size:16px;margin-top:4px}.utility-stage{display:grid;place-items:center;padding:clamp(20px,5vw,60px)}.panel{width:min(760px,100%);position:relative;z-index:3;border:1px solid var(--line);padding:clamp(22px,4vw,46px);background:rgba(8,8,22,.34);backdrop-filter:blur(18px);box-shadow:14px 14px 0 color-mix(in srgb,var(--a),transparent 78%)}.panel .eyebrow{color:var(--b);margin:0 0 14px}.panel h1{font-size:clamp(36px,6vw,76px);line-height:.85;letter-spacing:-.08em;margin:0}.panel p{color:rgba(255,255,255,.7);line-height:1.5;max-width:500px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:27px}.field{width:100%;margin-top:17px}.field label{display:flex;justify-content:space-between;margin-bottom:8px;color:rgba(255,255,255,.72)}input,select,textarea{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);padding:12px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--b)}input[type=range]{padding:0;accent-color:var(--b)}.result{margin-top:20px;border-top:1px solid var(--line);padding-top:18px;font-size:clamp(22px,4vw,40px);font-weight:800;letter-spacing:-.06em}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.tile{min-height:70px;border:1px solid var(--line);padding:10px;font-size:12px;cursor:pointer}.tile:hover,.tile.active{background:var(--a);color:var(--bg)}.orbit-card{position:absolute;z-index:2;right:18px;top:18px;width:min(300px,39vw);border:1px solid var(--line);padding:14px;background:rgba(5,5,15,.48);backdrop-filter:blur(9px)}.orbit-card h2{margin:5px 0 0;font-size:25px;letter-spacing:-.06em}.orbit-card p{font-size:12px;line-height:1.45;color:rgba(255,255,255,.65)}.ring{width:18px;height:18px;border:3px solid var(--b);border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}@media(max-width:680px){.shell{padding:12px}.stage{min-height:640px}.caption{top:48px}.caption h1{font-size:52px}.orbit-card{top:auto;bottom:18px;right:18px;width:calc(100% - 36px)}.hud{left:18px;right:auto}.tiles{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">Prism Cursor</div><span class="mono">CHROMA / 31 of 80</span></div><a class="mono" href="../../../../index.html">THIRTY ARCHIVE ↗</a></header><main class="stage"><canvas aria-label="Prism Cursor 互动画布"></canvas><section class="caption"><p class="mono eyebrow">CURSOR / 31</p><h1>Prism Cursor</h1><p>移动鼠标绘制颜色，点击释放更大的能量。这件标本完全由原生 Canvas 响应指针。</p></section><aside class="hud"><div class="meter"><span class="mono">interaction</span><b id="badge">MOVE · CLICK</b></div><button class="mono" onclick="document.querySelector('canvas').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,clientX:innerWidth/2,clientY:innerHeight/2}))">BURST COLOR</button></aside></main></div><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),pal=["#7B2CFF","#FFEA70"],pts=[];let d=1,w=0,h=0,last=0;function fit(){d=Math.min(devicePixelRatio,2);w=c.clientWidth;h=c.clientHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();function burst(px,py,n=6){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*5;pts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:3+Math.random()*7,h:Math.random()*360,l:1})}}c.addEventListener('pointermove',e=>{const now=performance.now();if(now-last>18){burst(e.offsetX,e.offsetY,4);last=now}});c.addEventListener('pointerdown',e=>burst(e.offsetX,e.offsetY,55));function loop(){x.fillStyle='rgba(0,0,0,.09)';x.fillRect(0,0,w,h);for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.975;p.vy*=.975;p.vy+=.015;p.l-=.012;x.beginPath();x.arc(p.x,p.y,p.r*p.l,0,6.28);x.fillStyle='hsla('+((p.h+performance.now()*.04)%360)+',100%,65%,'+Math.max(0,p.l)+')';x.shadowBlur=20;x.shadowColor=x.fillStyle;x.fill();if(p.l<=0)pts.splice(i,1)}x.shadowBlur=0;requestAnimationFrame(loop)}loop()</script></body></html>
