<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11133E"><title>Bubble Pop — Interactive Specimen 57</title><style>

:root{--bg:#11133E;--a:#89A8FF;--b:#FF80C8;--ink:#F7F7FF;--line:rgba(255,255,255,.2)}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(circle at 76% 12%,color-mix(in srgb,var(--a),transparent 85%),transparent 28%),var(--bg);color:var(--ink);font-family:Arial,sans-serif;overflow-x:hidden}.mono{font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}.shell{min-height:100%;padding:20px;display:flex;flex-direction:column;gap:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:18px;letter-spacing:-.07em}.top a,.chip,button{border:1px solid var(--line);background:rgba(0,0,0,.12);color:var(--ink);padding:9px 12px;text-decoration:none;cursor:pointer;transition:.2s ease}.top a:hover,.chip:hover,button:hover{border-color:var(--b);background:var(--b);color:var(--bg)}.stage{position:relative;flex:1;min-height:540px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--bg),black 16%),var(--bg));box-shadow:0 30px 80px rgba(0,0,0,.25)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.caption{position:absolute;left:clamp(22px,5vw,70px);top:clamp(30px,7vw,92px);z-index:2;max-width:min(580px,78vw);pointer-events:none}.caption .eyebrow{color:var(--b);margin-bottom:17px}.caption h1{font-size:clamp(42px,7vw,98px);line-height:.78;letter-spacing:-.09em;margin:0}.caption p{max-width:400px;line-height:1.5;color:rgba(255,255,255,.68);font-size:16px;margin:24px 0 0}.hud{position:absolute;z-index:2;right:18px;bottom:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.meter{min-width:150px;border:1px solid var(--line);padding:9px 10px;background:rgba(4,4,16,.4);backdrop-filter:blur(8px)}.meter b{display:block;color:var(--b);font-size:16px;margin-top:4px}.utility-stage{display:grid;place-items:center;padding:clamp(20px,5vw,60px)}.panel{width:min(760px,100%);position:relative;z-index:3;border:1px solid var(--line);padding:clamp(22px,4vw,46px);background:rgba(8,8,22,.34);backdrop-filter:blur(18px);box-shadow:14px 14px 0 color-mix(in srgb,var(--a),transparent 78%)}.panel .eyebrow{color:var(--b);margin:0 0 14px}.panel h1{font-size:clamp(36px,6vw,76px);line-height:.85;letter-spacing:-.08em;margin:0}.panel p{color:rgba(255,255,255,.7);line-height:1.5;max-width:500px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:27px}.field{width:100%;margin-top:17px}.field label{display:flex;justify-content:space-between;margin-bottom:8px;color:rgba(255,255,255,.72)}input,select,textarea{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);padding:12px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--b)}input[type=range]{padding:0;accent-color:var(--b)}.result{margin-top:20px;border-top:1px solid var(--line);padding-top:18px;font-size:clamp(22px,4vw,40px);font-weight:800;letter-spacing:-.06em}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.tile{min-height:70px;border:1px solid var(--line);padding:10px;font-size:12px;cursor:pointer}.tile:hover,.tile.active{background:var(--a);color:var(--bg)}.orbit-card{position:absolute;z-index:2;right:18px;top:18px;width:min(300px,39vw);border:1px solid var(--line);padding:14px;background:rgba(5,5,15,.48);backdrop-filter:blur(9px)}.orbit-card h2{margin:5px 0 0;font-size:25px;letter-spacing:-.06em}.orbit-card p{font-size:12px;line-height:1.45;color:rgba(255,255,255,.65)}.ring{width:18px;height:18px;border:3px solid var(--b);border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}@media(max-width:680px){.shell{padding:12px}.stage{min-height:640px}.caption{top:48px}.caption h1{font-size:52px}.orbit-card{top:auto;bottom:18px;right:18px;width:calc(100% - 36px)}.hud{left:18px;right:auto}.tiles{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">Bubble Pop</div><span class="mono">CHROMA / 57 of 80</span></div><a class="mono" href="../../../../index.html">THIRTY ARCHIVE ↗</a></header><main class="stage"><canvas aria-label="Bubble Pop 互动画布"></canvas><section class="caption"><p class="mono eyebrow">PHYSICS / 57</p><h1>Bubble Pop</h1><p>移动鼠标扰动场域，点击画面或控制按钮加入新的能量。</p></section><aside class="hud"><div class="meter"><span class="mono">interaction</span><b id="badge">MOVE · CLICK</b></div><button id="energy" class="mono">ADD ENERGY</button></aside></main></div><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),add=document.querySelector('#energy'),badge=document.querySelector('#badge');let d,w,h,mouse={x:-9e3,y:-9e3},items=[];function fit(){d=Math.min(devicePixelRatio,2);w=c.clientWidth;h=c.clientHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();function seed(n=18){for(let i=0;i<n;i++)items.push({x:Math.random()*w,y:Math.random()*h*.76+70,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,r:6+Math.random()*18,h:Math.random()*360})}seed();c.addEventListener('pointermove',e=>mouse={x:e.offsetX,y:e.offsetY});c.addEventListener('pointerdown',e=>{mouse={x:e.offsetX,y:e.offsetY};seed(9)});add&&add.addEventListener('click',()=>seed(14));function drawPendulum(t){x.clearRect(0,0,w,h);for(let i=0;i<14;i++){const ox=w*.12+i*w*.06,L=130+(i%5)*30,a=Math.sin(t*.0018+i*.42)*.65,px=ox+Math.sin(a)*L,py=90+Math.cos(a)*L;x.beginPath();x.moveTo(ox,70);x.lineTo(px,py);x.strokeStyle='hsla('+(i*28+190)+',90%,70%,.7)';x.stroke();x.beginPath();x.arc(px,py,12,0,6.28);x.fillStyle='hsla('+(i*28+190)+',90%,65%,1)';x.fill()}}function draw(){const time=performance.now();x.fillStyle='rgba(4,5,18,.16)';x.fillRect(0,0,w,h);if('balls'==='pendulum'){drawPendulum(time);requestAnimationFrame(draw);return}if('balls'==='wave'){for(let i=0;i<20;i++){const r=(time*.05+i*34)%620;x.beginPath();x.arc(mouse.x<0?w*.5:mouse.x,mouse.y<0?h*.5:mouse.y,r,0,6.28);x.strokeStyle='hsla('+(i*13+170)+',95%,70%,'+(1-r/620)+')';x.stroke()}requestAnimationFrame(draw);return}if('balls'==='flow'){items.forEach((p,i)=>{const a=Math.sin(p.y*.012+time*.001)+Math.cos(p.x*.009-time*.0007);p.vx+=Math.cos(a)*.03;p.vy+=Math.sin(a)*.03;p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w||p.y<0||p.y>h){p.x=Math.random()*w;p.y=Math.random()*h;p.vx=p.vy=0}x.fillStyle='hsla('+p.h+',100%,70%,.75)';x.fillRect(p.x,p.y,2,2)});requestAnimationFrame(draw);return}items.forEach((p,i)=>{const dx=mouse.x-p.x,dy=mouse.y-p.y,dist=Math.hypot(dx,dy)||1;if('balls'==='magnet'||'balls'==='flock') {p.vx+=dx/dist*.025;p.vy+=dy/dist*.025}p.vy+= 'balls'==='wind' ? Math.sin(time*.001)*.015 : .08;p.x+=p.vx;p.y+=p.vy;if(p.x-p.r<0||p.x+p.r>w)p.vx*=-.92;if(p.y-p.r<0||p.y+p.r>h)p.vy*=-.88;p.x=Math.max(p.r,Math.min(w-p.r,p.x));p.y=Math.max(p.r,Math.min(h-p.r,p.y));for(let j=i+1;j<items.length;j++){const q=items[j],dd=Math.hypot(p.x-q.x,p.y-q.y);if(dd<p.r+q.r){const a=Math.atan2(p.y-q.y,p.x-q.x);p.vx+=Math.cos(a)*.18;p.vy+=Math.sin(a)*.18;q.vx-=Math.cos(a)*.18;q.vy-=Math.sin(a)*.18}}x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fillStyle='hsla('+p.h+',95%,65%,.9)';x.shadowBlur=18;x.shadowColor=x.fillStyle;x.fill()});x.shadowBlur=0;if(badge)badge.textContent=items.length+' ACTIVE OBJECTS';requestAnimationFrame(draw)}draw()</script></body></html>
